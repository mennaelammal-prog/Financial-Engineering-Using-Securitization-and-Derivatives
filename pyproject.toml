[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-marketing-tool"
version = "0.1.0"
description = "Share & index analytics: TradingView-style charts, portfolio sensitivity (Beta/Alpha), Black-Scholes options pricing, and rule-based trade signals."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["trade_marketing_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
